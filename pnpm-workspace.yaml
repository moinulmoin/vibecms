packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@astrojs/cloudflare@14.1.3'
  - '@astrojs/markdown-satteri@0.3.4'
  - astro@7.0.8

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

overrides:
  tmp: ">=0.2.6"
