packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@astrojs/cloudflare@14.1.3'
  - '@cloudflare/vite-plugin@1.47.0'
  - '@cloudflare/vitest-pool-workers@0.18.8'
  - '@astrojs/markdown-satteri@0.3.4'
  - astro@7.0.8
  - miniflare@4.20260722.0
  - wrangler@4.114.0

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

overrides:
  "@cloudflare/vite-plugin": "1.47.0"
  esbuild: "0.28.1"
  tmp: ">=0.2.6"
  undici: "7.29.0"
