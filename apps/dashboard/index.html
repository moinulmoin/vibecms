<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>VibeCMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        let stored = null
        try {
          stored = localStorage.getItem('vc-theme')
        } catch {
          // Ignore storage restrictions and use the dark default.
        }
        const theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'dark'
        const prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        const resolved = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme
        document.documentElement.classList.remove('light', 'dark')
        document.documentElement.classList.add(resolved)
        document.documentElement.style.colorScheme = resolved
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
