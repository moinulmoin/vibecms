name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Static release checks (pnpm check)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${EVENT_NAME}" = pull_request ]; then
            export CHECK_BASE="origin/${BASE_REF}"
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != 0000000000000000000000000000000000000000 ]; then
            export CHECK_BASE="${BEFORE}"
          fi
          pnpm check

      - name: Build
        run: pnpm build

  # Tests run one package group per runner so timing-sensitive tests don't
  # compete for the same CPUs. api, public, db, and dashboard each get their
  # own runner; the remaining packages plus the preflight test share "rest".
  test:
    name: test (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: api
            run: pnpm --filter @vc/api test
          - group: public
            run: pnpm --filter @vc/public test
          - group: db
            run: pnpm --filter @vc/db test
          - group: dashboard
            run: pnpm --filter @vc/dashboard test
          - group: rest
            run: >-
              pnpm test:preflight &&
              pnpm -r --filter '!@vc/api' --filter '!@vc/public' --filter '!@vc/db' --filter '!@vc/dashboard' test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: ${{ matrix.run }}

  # One stable status for branch protection and production promotion.
  verify:
    if: always()
    needs: [checks, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All CI jobs passed
        run: test "${{ needs.checks.result }}" = success && test "${{ needs.test.result }}" = success
