name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Audit public release
        run: pnpm public:audit

      - name: Verify OpenAPI artifact
        run: pnpm openapi:check

      - name: Build
        run: pnpm build

  # Tests run one package group per runner so timing-sensitive tests don't
  # compete for the same CPUs. api, public, db, and dashboard each get their
  # own runner; the remaining packages plus the preflight test share "rest".
  test:
    name: test (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: api
            run: pnpm --filter @vc/api test
          - group: public
            run: pnpm --filter @vc/public test
          - group: db
            run: pnpm --filter @vc/db test
          - group: dashboard
            run: pnpm --filter @vc/dashboard test
          - group: rest
            run: >-
              pnpm test:preflight &&
              pnpm -r --filter '!@vc/api' --filter '!@vc/public' --filter '!@vc/db' --filter '!@vc/dashboard' test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: ${{ matrix.run }}

  # One stable status for "everything passed", whatever the jobs above are called.
  verify:
    if: always()
    needs: [checks, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All CI jobs passed
        run: test "${{ needs.checks.result }}" = success && test "${{ needs.test.result }}" = success
