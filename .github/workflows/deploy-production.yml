name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full 40-character commit SHA that was reviewed and approved for production"
        required: true
        type: string
      smoke_mode:
        description: "authenticated requires secrets.PRODUCTION_SMOKE_TOKEN; bootstrap is first-deploy only and skips authenticated smoke"
        required: true
        type: choice
        options:
          - authenticated
          - bootstrap
        default: authenticated

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - name: Verify immutable release commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "${CHECKED_OUT_SHA}" != "${RELEASE_SHA,,}" ]; then
            echo "Checked out ${CHECKED_OUT_SHA}, expected ${RELEASE_SHA,,}" >&2
            exit 1
          fi
          echo "Deploying reviewed commit ${CHECKED_OUT_SHA}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require authenticated smoke token
        if: ${{ inputs.smoke_mode == 'authenticated' }}
        env:
          PRODUCTION_SMOKE_TOKEN: ${{ secrets.PRODUCTION_SMOKE_TOKEN }}
        run: |
          if [ -z "${PRODUCTION_SMOKE_TOKEN}" ]; then
            echo "PRODUCTION_SMOKE_TOKEN secret is required for smoke_mode=authenticated" >&2
            echo "This workflow is only a thin wrapper around pnpm deploy:prod and cannot claim production gates without that input." >&2
            exit 1
          fi

      - name: Pin first-deploy bootstrap to the reviewed commit
        if: ${{ inputs.smoke_mode == 'bootstrap' }}
        env:
          PRODUCTION_BOOTSTRAP_SHA: ${{ secrets.PRODUCTION_BOOTSTRAP_SHA }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "${PRODUCTION_BOOTSTRAP_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "PRODUCTION_BOOTSTRAP_SHA must be a full 40-character production environment secret" >&2
            exit 1
          fi
          if [ "${PRODUCTION_BOOTSTRAP_SHA,,}" != "${RELEASE_SHA,,}" ]; then
            echo "Bootstrap is pinned to a different commit. Set PRODUCTION_BOOTSTRAP_SHA to the reviewed release_sha for the first deploy only." >&2
            exit 1
          fi

      - name: Canonical production deploy
        run: pnpm deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_SMOKE_TOKEN: ${{ inputs.smoke_mode == 'authenticated' && secrets.PRODUCTION_SMOKE_TOKEN || '' }}
          ALLOW_BOOTSTRAP_SMOKE: ${{ inputs.smoke_mode == 'bootstrap' && '1' || '' }}
          PRODUCTION_BOOTSTRAP_SHA: ${{ inputs.smoke_mode == 'bootstrap' && secrets.PRODUCTION_BOOTSTRAP_SHA || '' }}
