name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full 40-character commit SHA that was reviewed and approved for production"
        required: true
        type: string
      smoke_mode:
        description: "authenticated requires secrets.PRODUCTION_SMOKE_TOKEN; bootstrap is first-deploy only and skips authenticated smoke"
        required: true
        type: choice
        options:
          - authenticated
          - bootstrap
        default: authenticated

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - name: Verify immutable release commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "${CHECKED_OUT_SHA}" != "${RELEASE_SHA,,}" ]; then
            echo "Checked out ${CHECKED_OUT_SHA}, expected ${RELEASE_SHA,,}" >&2
            exit 1
          fi
          echo "Deploying reviewed commit ${CHECKED_OUT_SHA}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require authenticated smoke token
        if: ${{ inputs.smoke_mode == 'authenticated' }}
        env:
          PRODUCTION_SMOKE_TOKEN: ${{ secrets.PRODUCTION_SMOKE_TOKEN }}
        run: |
          if [ -z "${PRODUCTION_SMOKE_TOKEN}" ]; then
            echo "PRODUCTION_SMOKE_TOKEN secret is required for smoke_mode=authenticated" >&2
            echo "This workflow is only a thin wrapper around pnpm deploy:prod and cannot claim production gates without that input." >&2
            exit 1
          fi

      - name: Pin first-deploy bootstrap to the reviewed commit
        if: ${{ inputs.smoke_mode == 'bootstrap' }}
        env:
          PRODUCTION_BOOTSTRAP_SHA: ${{ secrets.PRODUCTION_BOOTSTRAP_SHA }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "${PRODUCTION_BOOTSTRAP_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "PRODUCTION_BOOTSTRAP_SHA must be a full 40-character production environment secret" >&2
            exit 1
          fi
          if [ "${PRODUCTION_BOOTSTRAP_SHA,,}" != "${RELEASE_SHA,,}" ]; then
            echo "Bootstrap is pinned to a different commit. Set PRODUCTION_BOOTSTRAP_SHA to the reviewed release_sha for the first deploy only." >&2
            exit 1
          fi

      - name: Canonical production deploy
        id: deploy
        run: pnpm deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_SMOKE_TOKEN: ${{ inputs.smoke_mode == 'authenticated' && secrets.PRODUCTION_SMOKE_TOKEN || '' }}
          ALLOW_BOOTSTRAP_SMOKE: ${{ inputs.smoke_mode == 'bootstrap' && '1' || '' }}
          PRODUCTION_BOOTSTRAP_SHA: ${{ inputs.smoke_mode == 'bootstrap' && secrets.PRODUCTION_BOOTSTRAP_SHA || '' }}

      # pnpm deploy:prod runs production:backup internally, before any D1
      # migration or Worker deploy. Keep that recovery bookmark even when a
      # later step fails: the runner's .wrangler/ directory is discarded with
      # the job. Only recovery metadata and the schema-only export are staged;
      # env files, Wrangler state, and data dumps are never uploaded. The repo
      # is public, so emails and the account ID are redacted from metadata.
      - name: Stage production recovery files
        if: ${{ always() }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SMOKE_MODE: ${{ inputs.smoke_mode }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          out="${RUNNER_TEMP}/production-recovery"
          rm -rf "${out}"
          backups=(.wrangler/production-backup/*/)
          if [ "${#backups[@]}" -eq 0 ]; then
            echo "::warning::No production backup was captured; pnpm deploy:prod stopped before production:backup."
            exit 0
          fi
          mkdir -p "${out}"
          redact='walk(if type == "object" then del(.author_email) else . end)
            | walk(if type == "string"
                then (gsub("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"; "[redacted-email]")
                  | if $account != "" then gsub($account; "[redacted-account-id]") else . end)
                else . end)'
          for dir in "${backups[@]}"; do
            stamp="$(basename "${dir}")"
            dest="${out}/production-backup/${stamp}"
            mkdir -p "${dest}"
            if [ -f "${dir}backup-metadata.json" ]; then
              jq --arg account "${CLOUDFLARE_ACCOUNT_ID:-}" "${redact}" "${dir}backup-metadata.json" > "${dest}/backup-metadata.json"
            fi
            if [ -f "${dir}schema.sql" ]; then
              if grep -Eqi '^[[:space:]]*INSERT[[:space:]]' "${dir}schema.sql"; then
                echo "::warning::${dir}schema.sql contains INSERT statements; not uploading a data dump."
              else
                cp "${dir}schema.sql" "${dest}/schema.sql"
              fi
            fi
          done
          if [ -f .wrangler/production/last-backup.json ]; then
            cp .wrangler/production/last-backup.json "${out}/last-backup.json"
          fi
          jq -n \
            --arg releaseSha "${RELEASE_SHA}" \
            --arg smokeMode "${SMOKE_MODE}" \
            --arg deployOutcome "${DEPLOY_OUTCOME}" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            '{releaseSha: $releaseSha, smokeMode: $smokeMode, deployOutcome: $deployOutcome, runUrl: $runUrl,
              bookmarkPath: "production-backup/<stamp>/backup-metadata.json#.d1.timeTravelInfo.bookmark"}' \
            > "${out}/run.json"
          find "${out}" -type f -print

      - name: Upload production recovery files
        if: ${{ always() }}
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: production-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-recovery/
          if-no-files-found: warn
          retention-days: 90
