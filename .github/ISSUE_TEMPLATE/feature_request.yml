name: Feature request
description: Suggest an improvement for vibecms
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Product surface
      options:
        - Dashboard/UI
        - Public blog
        - MCP/API
        - Billing
        - Self-hosting/deploy
        - Other
    validations:
      required: true
