# Git hooks for vibecms, managed by lefthook (https://lefthook.dev).
# Re-wire after editing with: pnpm exec lefthook install
#
# pre-commit: runs on every commit - secrets/placeholders audit (public:audit),
#             a full typecheck, and the generated agent-skills check.
# pre-push:   typecheck + build before code leaves your machine. Package
#             tests run in the parallel CI test jobs, not in this hook.

pre-commit:
  parallel: true
  commands:
    audit:
      run: pnpm public:audit
    typecheck:
      run: pnpm typecheck
    agent-skills:
      run: node scripts/gen-agent-skills.mjs --check

pre-push:
  commands:
    gates:
      run: pnpm typecheck && pnpm build
