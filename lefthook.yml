# Git hooks for VibeCMS, managed by lefthook (https://lefthook.dev).
# Re-wire after editing with: pnpm exec lefthook install
#
# pre-commit: runs on every commit - secrets/placeholders (audit), no em-dashes
#             on staged code/content, and a full typecheck.
# pre-push:   typecheck + build before code leaves your machine and triggers the
#             dev auto-deploy (Workers Builds only runs vite build, which skips
#             type errors). This repo has no test runner; these gates ARE the
#             verification.

pre-commit:
  parallel: true
  commands:
    audit:
      run: pnpm public:audit
    no-em-dash:
      glob: "*.{ts,tsx,css,md,mjs,cjs,js,html}"
      run: "! grep -l '—' {staged_files}"
    typecheck:
      run: pnpm typecheck

pre-push:
  commands:
    gates:
      run: pnpm typecheck && pnpm build
